<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#03080f">
<title>Novius</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%2334d399'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 23V9l12 14V9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/styles.css">
</head>
<body>
<div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i><div class="grid"></div></div>
<div class="scrim" id="scrim"></div>
<aside>
  <div class="brand"><div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19V5l12 14V5"/></svg></div>
    <div><span class="logo">Novius</span><span class="ver">V4.0</span></div></div>
  <button class="newchat" id="newchat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
  <div class="searchrow">
    <input id="search" placeholder="Search your chats..." aria-label="Search chats">
    <button id="searchbtn" title="Search chats (Ctrl+K)" aria-label="Search chats"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  </div>
  <div class="stitle">Your chats</div>
  <div class="chatlist" id="chatlist"></div>
  <div class="foot"><span class="live"></span>
    <div class="me">
      <div class="who" id="who"></div>
      <div class="msub">Running locally in pure NumPy</div>
    </div>
    <button id="signout" title="Sign out" aria-label="Sign out"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div>
</aside>
<main>
  <header>
    <button class="burger" id="burger" aria-label="Open menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span>Chatting with</span>
    <div class="mselect" id="msel">
      <button class="msbtn" id="msbtn" aria-haspopup="listbox">
        <span class="msname" id="msname">Crusta</span>
        <span class="badge" id="curbadge"></span>
        <svg class="mschev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="msmenu" id="msmenu" role="listbox"></div>
    </div>
    <span class="hspacer"></span>
    <span class="vchip">V4.0</span>
  </header>
  <div id="chat"><div class="inner" id="feed"></div></div>
  <button id="s2b" title="Scroll to latest" aria-label="Scroll to latest"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg></button>
  <div class="composer"><div class="box">
    <button id="webbtn" aria-pressed="false" title="Search the web for real answers"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span>Web</span></button>
    <textarea id="input" rows="1" aria-label="Message" placeholder="Message Novius..."></textarea>
    <button id="send" title="Send" aria-label="Send" disabled></button>
  </div>
  <div class="hint">Lightweight open-source AI trained on Wikipedia, WordNet, code and internet chat &middot; <kbd>Enter</kbd> to send, <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</div></div>
</main>
<div id="toasts"></div>
<script src="/web/app.js"></script>
</body>
</html>
